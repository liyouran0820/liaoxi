name: Release builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build executable
        shell: powershell
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ChatArchive-Windows
          path: |
            windows/dist/ChatArchive-Windows-x64.exe
            windows/dist/ChatArchive-Windows-x64.zip
            windows/dist/packaged-smoke.json
          if-no-files-found: error
  macos:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Build universal app and disk image
        run: zsh scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ChatArchive-macOS-CI
          path: |
            dist/ChatArchive-macOS-universal.dmg
            dist/ChatArchive-macOS-universal.zip
          if-no-files-found: error
